<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ginyva 工具站 — 独立开发的软件工具箱</title>
<meta name="description" content="Ginyva 的软件工具站：收录独立开发的全部软件项目，每个都有独立主页、下载与更新日志；欢迎在社区反馈区提交意见与建议。">
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("site-theme"); } catch (e) {}
    if (t === "dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>我</text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/hub.css">
</head>
<body>

<a class="skip-link" href="#projects">跳到项目列表</a>

<header class="site-header" id="siteHeader">
  <nav class="nav container" aria-label="主导航">
    <a class="brand" href="#top">
      <span class="brand-dot" aria-hidden="true"></span>
      <span id="brandName">Ginyva 工具站</span>
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深浅色模式" aria-pressed="false" title="切换深浅色">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"></path></svg>
    </button>
    <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a class="nav-link" href="#projects">项目</a></li>
      <li><a class="nav-link" href="#feedback">社区反馈</a></li>
      <li><a class="nav-link" href="https://github.com/GinyvaXu" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    </ul>
  </nav>
</header>

<main>

  <!-- ========== 首屏 ========== -->
  <section class="hub-hero" id="top">
    <div class="hero-bg" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>
    <div class="container hub-hero-inner">
      <p class="hub-eyebrow">GINYVA · 独立开发 · 软件工具站</p>
      <h1 class="hub-title">好用的工具，<em>一个个做出来</em></h1>
      <p class="hub-sub">
        这里收录我独立开发的全部软件——每个项目都有<strong>独立主页</strong>、<strong>下载</strong>与<strong>更新日志</strong>。<br>
        遇到问题、想要新功能，欢迎在「社区反馈」告诉我。
      </p>
      <div class="hub-actions">
        <a class="btn btn-primary" href="#projects">浏览全部项目</a>
        <a class="btn btn-ghost" href="#feedback">💬 提交反馈</a>
      </div>
      <div class="hub-stats" id="hubStats"></div>
    </div>
  </section>

  <!-- ========== 项目 ========== -->
  <section class="section" id="projects">
    <div class="container">
      <h2 class="section-title reveal">项目</h2>
      <p class="section-sub reveal" id="projectsSub"></p>
      <div class="hub-grid" id="projectGrid"></div>
    </div>
  </section>

  <!-- ========== 社区反馈 ========== -->
  <section class="section section-alt" id="feedback">
    <div class="container">
      <h2 class="section-title reveal">社区反馈</h2>
      <p class="section-sub reveal">
        任何问题、建议、想法都可以在这里提。反馈会公开显示（联系方式不会公开），我会定期回复并更新状态。
      </p>

      <div class="fb-grid">
        <form class="fb-form reveal" id="fbForm" autocomplete="off">
          <h3>✍️ 提交反馈</h3>
          <label class="fb-field">
            <span>选择项目 *</span>
            <select id="fbProject" name="project"></select>
          </label>
          <div class="fb-row">
            <label class="fb-field">
              <span>昵称（选填）</span>
              <input id="fbName" name="name" type="text" maxlength="24" placeholder="怎么称呼你？">
            </label>
            <label class="fb-field">
              <span>联系方式（选填，不公开）</span>
              <input id="fbContact" name="contact" type="text" maxlength="100" placeholder="邮箱 / QQ，方便回复你">
            </label>
          </div>
          <label class="fb-field">
            <span>反馈内容 *</span>
            <textarea id="fbMessage" name="message" rows="5" maxlength="800" placeholder="遇到的问题 / 想要的功能 / 任何想法…（4–800 字）"></textarea>
          </label>
          <input type="text" id="fbHp" name="_hp" class="fb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn btn-primary" id="fbSubmit" type="submit">发送反馈</button>
          <p class="fb-status" id="fbStatus" role="status"></p>
        </form>

        <div class="fb-list-wrap reveal">
          <div class="fb-list-head">
            <h3>最新反馈</h3>
            <button class="btn btn-ghost btn-sm" id="fbRefresh" type="button">刷新</button>
          </div>
          <div class="fb-list" id="fbList">
            <p class="fb-empty">加载中…</p>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <p id="footerText"></p>
    <div class="footer-socials" id="footerSocials"></div>
    <p class="site-visits">本站累计访问 <span id="busuanzi_value_site_pv">--</span> 次 · 访客 <span id="busuanzi_value_site_uv">--</span> 人</p>
  </div>
</footer>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script src="data/site.js"></script>
<script src="data/projects.js"></script>
<script src="data/releases.js"></script>
<script src="js/main.js"></script>
</body>
</html>
