<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人网站</title>
<meta name="description" content="Ginyva / 八奈見真尋 的个人网站：关于我、主力项目 AgentFloat、开发日志与联系方式">
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("site-theme"); } catch (e) {}
    if (t === "dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>我</text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#projects">跳到项目列表</a>

<header class="site-header" id="siteHeader">
  <nav class="nav container" aria-label="主导航">
    <a class="brand" href="#home">
      <span class="brand-dot" aria-hidden="true"></span>
      <span id="brandName">个人网站</span>
    </a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深浅色模式" aria-pressed="false" title="切换深浅色">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.2M12 19.3v2.2M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6"></path></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"></path></svg>
    </button>
    <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a class="nav-link active" href="#home">首页</a></li>
      <li><a class="nav-link" href="#about">关于我</a></li>
      <li><a class="nav-link" href="#featured">主力项目</a></li>
      <li><a class="nav-link" href="#projects">我的项目</a></li>
      <li><a class="nav-link" href="#logs">日志</a></li>
      <li><a class="nav-link" href="#guestbook">留言</a></li>
      <li><a class="nav-link" href="#contact">联系</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="hero" id="home">
    <div class="hero-bg" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>
    <div class="container hero-inner">
      <div class="hero-avatar-wrap" id="heroAvatar"></div>
      <h1 class="hero-name" id="heroName"><span id="heroNameText"></span></h1>
      <p class="hero-tagline" id="heroTagline"></p>
      <div class="hero-socials" id="heroSocials"></div>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#featured">看看主力项目</a>
        <a class="btn btn-ghost" href="#projects">浏览全部项目</a>
      </div>
    </div>
  </section>

  <section class="section" id="about">
    <div class="container">
      <h2 class="section-title reveal">关于我</h2>
      <div class="about-grid">
        <p class="about-text reveal" id="aboutText"></p>
        <div class="about-stats reveal" id="aboutStats"></div>
      </div>
    </div>
  </section>

  <section class="section section-featured" id="featured">
    <div class="container">
      <div class="featured-head reveal">
        <span class="featured-eyebrow">CURRENT FOCUS · 当前主力</span>
        <h2 class="section-title">正在打磨的东西</h2>
        <p class="section-sub">最近投入最多心力的项目，持续迭代中。</p>
      </div>
      <div class="featured-panel reveal" id="featuredPanel"></div>
    </div>
  </section>

  <section class="section section-alt" id="projects">
    <div class="container">
      <h2 class="section-title reveal">我的项目</h2>
      <p class="section-sub reveal" id="projectsSub"></p>
      <div class="filters reveal" id="filters" role="tablist" aria-label="项目分类筛选"></div>
      <div class="project-grid" id="projectGrid"></div>
    </div>
  </section>

  <section class="section" id="logs">
    <div class="container">
      <h2 class="section-title reveal">开发日志</h2>
      <p class="section-sub reveal">记录每一次迭代、踩过的坑和想说的话。</p>
      <div class="logs-list reveal" id="logsList"></div>
    </div>
  </section>

  <section class="section section-alt" id="guestbook">
    <div class="container guestbook-inner">
      <h2 class="section-title reveal">留言板</h2>
      <p class="section-sub reveal">欢迎留下你的想法 —— 评论需要 GitHub 账号登录。</p>
      <div class="guestbook-box reveal" id="guestbookBox"></div>
      <p class="section-sub guestbook-visits reveal">本站累计访问 <span id="busuanzi_value_site_pv">--</span> 次 · 访客 <span id="busuanzi_value_site_uv">--</span> 人</p>
    </div>
  </section>

  <section class="section" id="contact">
    <div class="container contact-inner">
      <h2 class="section-title reveal">联系我</h2>
      <p class="section-sub reveal">想交流、合作，或对我的项目感兴趣？欢迎通过以下方式找到我。</p>
      <div class="contact-socials reveal" id="contactSocials"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p id="footerText"></p>
  </div>
</footer>

<div class="modal" id="projectModal" aria-hidden="true">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" data-close-modal aria-label="关闭" type="button">&times;</button>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script src="data/site.js"></script>
<script src="data/projects.js"></script>
<script src="data/logs.js"></script>
<script src="js/main.js"></script>
</body>
</html>
