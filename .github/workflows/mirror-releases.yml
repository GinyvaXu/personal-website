# ============================================================
# 下载镜像 + 发布信息同步管线
#   GitHub Releases → Cloudflare R2（ginyva-downloads）
#   同时生成 data/releases.js 并提交回本仓库（网站自动读取最新下载地址）
#
# 触发：手动 / 每天定时 / repository_dispatch(release-published)
# 访问：https://dl.ginyva.site/releases/<项目>/latest/<文件名>
# ============================================================
name: Mirror releases to R2

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"          # 每天 UTC 20:17（北京时间 04:17）
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write                  # 需要提交 data/releases.js

env:
  BUCKET: ginyva-downloads
  BASE_URL: https://dl.ginyva.site

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Mirror all projects
        run: |
          set -euo pipefail

          mirror() {
            pid="$1"; repo="$2"
            echo "=========== $pid ($repo) ==========="
            tag=$(gh api "repos/$repo/releases?per_page=1" --jq '.[0].tag_name // empty')
            if [ -z "$tag" ]; then echo "  无 Release，跳过"; return 0; fi

            rm -rf work; mkdir -p work/dist
            old_tag=""
            if wrangler r2 object get "$BUCKET/releases/$pid/latest.json" --file work/old.json --remote >/dev/null 2>&1; then
              old_tag=$(jq -r '.tag // empty' work/old.json || true)
            fi
            if [ "$old_tag" = "$tag" ]; then echo "  已是最新（$tag），跳过"; return 0; fi
            echo "  更新：${old_tag:-<无>} → $tag"

            gh release download "$tag" -R "$repo" -D work/dist
            ls -lh work/dist

            # 删除旧版本文件（按旧 latest.json 清单）
            if [ -f work/old.json ]; then
              while read -r n; do
                [ -n "$n" ] && wrangler r2 object delete "$BUCKET/releases/$pid/latest/$n" --remote || true
              done < <(jq -r '.files[]?.name // empty' work/old.json)
            fi

            # 上传新文件
            for f in work/dist/*; do
              name=$(basename "$f")
              wrangler r2 object put "$BUCKET/releases/$pid/latest/$name" --file "$f" --remote
            done

            # 生成并上传 latest.json
            jq -n --arg pid "$pid" --arg tag "$tag" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg base "$BASE_URL/releases/$pid/latest/" \
              '{project:$pid, tag:$tag, updatedAt:$ts, base:$base, files:[]}' > work/latest.json
            for f in work/dist/*; do
              name=$(basename "$f"); size=$(stat -c%s "$f")
              jq --arg n "$name" --argjson s "$size" '.files += [{"name":$n,"size":$s}]' work/latest.json > work/tmp.json
              mv work/tmp.json work/latest.json
            done
            cat work/latest.json
            wrangler r2 object put "$BUCKET/releases/$pid/latest.json" --file work/latest.json --remote \
              --content-type "application/json; charset=utf-8"
            echo "  ✅ $pid 完成"
          }

          mirror projectdock  GinyvaXu/ProjectDock
          mirror agentfloat   GinyvaXu/AgentFloat
          mirror cloudbox     GinyvaXu/cloudbox-portable
          mirror ginyscreen   GinyvaXu/GinyScreen
          mirror nottingham   GinyvaXu/SheriffOfNottingham---Ultimate
          mirror claudefloat  GinyvaXu/ClaudeFloat
          mirror hexwar       GinyvaXu/HexWarDemo

          echo "镜像全部完成"

      - name: Generate data/releases.js
        run: |
          set -euo pipefail
          mkdir -p work/all
          cat > work/gen.cjs <<'NODE'
          const { execSync } = require("child_process");
          const fs = require("fs");
          const ids = ["projectdock","agentfloat","cloudbox","ginyscreen","nottingham","claudefloat","hexwar"];
          const out = {};
          for (const id of ids) {
            try {
              execSync(`wrangler r2 object get ${process.env.BUCKET}/releases/${id}/latest.json --file work/all/${id}.json --remote`, { stdio: "ignore" });
              out[id] = JSON.parse(fs.readFileSync(`work/all/${id}.json`, "utf8"));
            } catch (e) {
              console.log("skip " + id + ": " + String(e).slice(0, 120));
            }
          }
          fs.mkdirSync("data", { recursive: true });
          fs.writeFileSync("data/releases.js",
            "/* 由镜像管线自动生成（GitHub Actions），请勿手改 */\nwindow.RELEASES = " +
            JSON.stringify(out, null, 2) + ";\n");
          console.log("releases.js 已更新: " + Object.keys(out).join(", "));
          NODE
          node work/gen.cjs

      - name: Commit releases.js
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/releases.js
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动更新发布信息（releases.js）"
            git push
            echo "已提交并推送"
          fi
