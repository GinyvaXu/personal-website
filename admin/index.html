<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>控制台 · Ginyva 工具站</title>
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("site-theme"); } catch (e) {}
    if (t === "dark" || (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'%3E控%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

<header class="admin-top">
  <div class="container admin-top-inner">
    <span class="admin-brand">🔧 Ginyva 控制台</span>
    <span class="admin-top-actions">
      <a class="btn btn-ghost btn-sm" href="../">返回首页</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" type="button" hidden>退出登录</button>
    </span>
  </div>
</header>

<main class="container admin-main">

  <!-- 登录 -->
  <section id="loginView" class="admin-login" hidden>
    <h1>管理员登录</h1>
    <p class="admin-sub">仅站长本人使用。登录后可以管理社区反馈与文件仓库。</p>
    <form id="loginForm" autocomplete="on">
      <input type="password" id="loginPass" placeholder="管理密码" autocomplete="current-password" required>
      <button class="btn btn-primary" id="loginBtn" type="submit">登录</button>
    </form>
    <p class="admin-hint" id="loginStatus"></p>
  </section>

  <!-- 控制台 -->
  <section id="dashView" hidden>
    <div class="admin-block">
      <div class="admin-block-head">
        <h2>💬 反馈管理</h2>
        <button class="btn btn-ghost btn-sm" id="fbReload" type="button">刷新</button>
      </div>
      <div id="adminFbList" class="admin-fb-list"><p class="admin-empty">加载中…</p></div>
    </div>

    <div class="admin-block">
      <div class="admin-block-head">
        <h2>📁 文件仓库 <small>私有存储 · 单文件 ≤ 24MB</small></h2>
      </div>
      <form id="uploadForm" class="admin-upload">
        <input type="file" id="uploadFile">
        <button class="btn btn-primary btn-sm" id="uploadBtn" type="submit">上传</button>
        <span class="admin-hint" id="uploadStatus"></span>
      </form>
      <div id="adminFileList" class="admin-file-list"><p class="admin-empty">加载中…</p></div>
    </div>
  </section>

</main>

<script src="admin.js"></script>
</body>
</html>
